name: Verify distribution markets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run tools:arc
      - name: Start disposable Arc runtime
        run: |
          npm run node:arc > work/arc-node.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent --header 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8547; then break; fi
            sleep 1
          done
      - run: npm run test:reference
      - run: npm run test:contracts
      - run: npm run test:forge
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
