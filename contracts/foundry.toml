[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../node_modules"]
remappings = [
  "@prb/math/=../node_modules/@prb/math/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"
]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "ipfs"

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
